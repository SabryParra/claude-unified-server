app = "claude-unified-server"
primary_region = "cdg"          # Paris — change to your closest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  CUS_DATA_DIR = "/data"

# JWT_SECRET must be set as a secret, never in env:
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[mounts]]
  source = "cus_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
